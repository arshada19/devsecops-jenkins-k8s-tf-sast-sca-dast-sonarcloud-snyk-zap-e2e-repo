apiVersion: apps/v1
kind: Deployment
metadata:
  name: arshadabuggy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arshadabuggy
  template:
    metadata:
      labels:
        app: arshadabuggy
    spec:
      containers:
      - name: arshadabuggy
        image: 399439484575.dkr.ecr.us-west-2.amazonaws.com/arshada
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
# service type loadbalancer       
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: arshadabuggy
    k8s-app: arshadabuggy
  name: arshadabuggy
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  type: LoadBalancer
  selector:
    app: arshadabuggy
